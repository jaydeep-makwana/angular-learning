<h1>User CRUD App</h1>

<div class="form-container">

  <input
    type="text"
    placeholder="Enter Name"
    [(ngModel)]="name"
  >

  <input
    type="email"
    placeholder="Enter Email"
    [(ngModel)]="email"
  >

  @if(!editMode) {

    <button (click)="saveUser()">
      Add User
    </button>

  } @else {

    <button (click)="updateUser()">
      Update User
    </button>

  }

</div>

<hr>

<h2>User List</h2>

@if(users.length === 0) {

  <p>No users found.</p>

}

@for(user of users; track user.id) {

  <div class="user-card">

    <p>
      <strong>Name:</strong>
      {{ user.name }}
    </p>

    <p>
      <strong>Email:</strong>
      {{ user.email }}
    </p>

    <button (click)="editUser(user)">
      Edit
    </button>

    <button (click)="deleteUser(user.id)">
      Delete
    </button>

  </div>

}
